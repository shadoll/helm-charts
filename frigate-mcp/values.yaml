image:
  repository: ghcr.io/jakekeeys/frigate-mcp
  pullPolicy: IfNotPresent

command: ["frigate-mcp-web"]

port: 8086

existingSecret: ""
secretEnvKeys: []
  # - envName: FRIGATE_URL
  #   secretKey: FRIGATE_URL

env: {}
  # FRIGATE_TIMEOUT: "30"
  # MCP_HOST: "0.0.0.0"
