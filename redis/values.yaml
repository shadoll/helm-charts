replicaCount: 1

image:
  repository: redis
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.AppVersion

nameOverride: ""
fullnameOverride: ""

auth:
  enabled: true
  existingSecret: ""
  passwordKey: REDIS_PASSWORD

persistence:
  enabled: false
  existingClaim: ""
  storageClass: local-path
  size: 1Gi

service:
  type: ClusterIP
  port: 6379
  nodePort: ""

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m

nodeSelector: {}
affinity: {}
tolerations: []
